name: Hypium

# The target event uses this trusted base workflow while checking out each PR head.
on:
  pull_request_target:
  push:
    branches:
      - main
      - codex/self-hosted-hypium-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: harmonyos
    timeout-minutes: 30
    env:
      DEVECO_SDK_HOME: /Users/luoyige/.aiphone/deveco-sdk
      OHOS_SDK_HOME: /Users/luoyige/.aiphone/deveco-sdk/default/openharmony
      JAVA_HOME: /Applications/DevEco-Studio.app/Contents/jbr/Contents/Home
      NODE_HOME: /Applications/DevEco-Studio.app/Contents/tools/node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      - name: Reject machine-local signing config
        run: |
          /Applications/DevEco-Studio.app/Contents/tools/node/bin/node <<'NODE'
          const fs = require('node:fs');
          const JSON5 = require('/Applications/DevEco-Studio.app/Contents/tools/hvigor/hvigor-ohos-plugin/node_modules/json5');
          const profile = JSON5.parse(fs.readFileSync('build-profile.json5', 'utf8'));
          const app = profile.app || {};
          const product = (app.products || []).find(({ name }) => name === 'default');
          const fail = message => {
            console.error(`::error file=build-profile.json5::${message}`);
            process.exit(1);
          };
          if (!product || product.signingConfig !== 'default') {
            fail('The default product must select the local default signing config.');
          }
          if (Object.prototype.hasOwnProperty.call(app, 'signingConfigs')) {
            fail('Keep signingConfigs in a private local config; do not commit it.');
          }
          const forbidden = new Set(['keyPassword', 'storePassword', 'certpath', 'storeFile']);
          const containsSigningMaterial = value => value && typeof value === 'object' && Object.entries(value).some(
            ([key, child]) => forbidden.has(key) || containsSigningMaterial(child)
          );
          if (containsSigningMaterial(profile)) {
            fail('Keep signing material in a private local config; do not commit it.');
          }
          NODE
          if git ls-files | grep -Eiq '\.(p12|cer|p7b|jks|keystore)$'; then
            echo "::error::Do not commit signing certificates, profiles, or keystores."
            exit 1
          fi

      - name: Test public share server
        run: /Applications/DevEco-Studio.app/Contents/tools/node/bin/node scripts/waterfall-share-server.test.mjs

      - name: Test login services
        run: /Applications/DevEco-Studio.app/Contents/tools/node/bin/node --test scripts/agc-sms-server.test.mjs scripts/wechat-auth-server.test.mjs scripts/sync-auth-config.test.mjs scripts/cloud-account-service.test.mjs scripts/account-worker-lifecycle.test.mjs

      - name: Install dependencies
        run: /Applications/DevEco-Studio.app/Contents/tools/ohpm/bin/ohpm install --all

      - name: Run Hypium
        run: |
          /Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw test \
            -p product=default \
            -p module=entry@default \
            -p testType=unit \
            --no-daemon

      - name: Verify Hypium result
        run: |
          result=entry/.test/default/intermediates/test/coverage_data/test_result.txt
          test -f "$result"
          tail -5 "$result"
          grep -Eq '^Tests run: [1-9][0-9]*, Failure: 0, Error: 0, Pass: [0-9]+, Ignore: [0-9]+$' "$result"

      - name: Upload Hypium result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypium-result
          path: entry/.test/default/intermediates/test/coverage_data/test_result.txt
          if-no-files-found: ignore
          retention-days: 7
